name: Check and Test
on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: nightly

      - name: post install
        run: |
          moon version --all
          moon update

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup wasmtime
        uses: jcbhmr/setup-wasmtime@v2

      - name: moon check & test
        run: |
          moon check
          moon test

      - name: e2e test
        run: |
          deno task test:build
          deno task test

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code

